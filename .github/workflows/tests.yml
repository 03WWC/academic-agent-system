name: tests

# 这套单测覆盖多 Agent 编排与教务工具，不依赖向量库（sentence-transformers / torch），
# 所以这里只安装测试所需的最小依赖，让 CI 保持快速。
# 需要完整依赖时请参考 README 中的 poetry install。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            langgraph langchain-openai python-dotenv \
            "fastapi>=0.116,<0.117" "jinja2>=3.1,<4" "httpx>=0.27,<0.29"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
