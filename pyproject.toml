[tool.poetry]
name = "academic-agent-system"
version = "0.1.0"
description = "Academic affairs multi-agent assistant system"
authors = ["Wang Wenchuan <portfolio@example.com>"]
readme = "README.md"
package-mode = false

# 只声明代码真正 import 的包。此前遗留的 ipython / ddgs / pandas / sentence-transformers
# 等依赖无人引用，其中 sentence-transformers 会额外拉入 torch，让 poetry install 白下载数 GB。
[tool.poetry.dependencies]
python = "^3.12"
langgraph = "^0.2.19"
langchain-openai = "^0.1.23"
python-dotenv = "^1.0.1"
pydantic = "^2.7"
typing-extensions = "^4.12"
fastapi = "^0.116.1"
uvicorn = {extras = ["standard"], version = "^0.35.0"}
jinja2 = "^3.1.6"
httpx = "^0.27.0"
pytest = "^8.3.4"

[tool.pytest.ini_options]
pythonpath = ["."]

[[tool.poetry.source]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
priority = "primary"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
