[tool.poetry]
name = "web-app"
version = "0.1.0"
description = "教务多 Agent 学生服务系统的 Web 界面"
authors = ["Wang Wenchuan <portfolio@example.com>"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
# 因为网络环境可能不稳定，这里手动列出 Web 应用核心依赖。
# 正常情况下也可以使用 poetry add fastapi[all] httpx python-multipart。
# 下面保留 FastAPI Web 页面运行需要的关键包。
fastapi = "^0.112.2"
uvicorn = {version = "^0.30.6", extras = ["standard"]}
jinja2 = "^3.1.4" # 模板渲染
python-multipart = "^0.0.9" # 表单数据解析
httpx = "^0.27.2" # 网络请求工具
itsdangerous = "^2.2.0" # 会话中间件依赖

[[tool.poetry.source]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
priority = "primary"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
